<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Math Shooter 3D</title>
    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Kanit', sans-serif; background-color: #000; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 32px; height: 32px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ffff; box-shadow: 0 0 10px #00ffff; }
        #crosshair::before { top: 15px; left: 0; width: 32px; height: 2px; }
        #crosshair::after { top: 0; left: 15px; width: 2px; height: 32px; }
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .hud-top { display: flex; justify-content: space-between; gap: 10px; }
        .hud-box { background: rgba(10, 20, 40, 0.75); border: 1px solid rgba(0, 255, 255, 0.4); box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); padding: 10px 20px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; min-width: 110px; backdrop-filter: blur(8px); }
        .hud-label { font-size: 0.85rem; color: #8ae3ff; }
        .hud-value { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; font-weight: 700; color: #ffffff; text-shadow: 0 0 8px #00ffff; }
        .timer-box .hud-value { color: #ffdd00; text-shadow: 0 0 8px #ffaa00; }
        #question-banner { align-self: center; background: rgba(5, 10, 25, 0.85); border: 2px solid #00ffff; box-shadow: 0 0 25px rgba(0, 255, 255, 0.5); border-radius: 20px; padding: 15px 40px; text-align: center; backdrop-filter: blur(10px); margin-top: 10px; animation: fadeInDown 0.4s ease-out; }
        .q-title { font-size: 0.9rem; color: #00ffff; letter-spacing: 2px; }
        #math-expression { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; font-weight: 900; color: #fff; text-shadow: 0 0 15px #00ffff; }
        .toast { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.85); border: 1px solid #00ffff; color: #00ffff; padding: 10px 25px; border-radius: 30px; font-size: 1rem; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); transition: opacity 0.3s ease; }
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 18, 0.9); z-index: 20; display: flex; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(12px); }
        .modal-card { background: linear-gradient(135deg, rgba(15, 25, 50, 0.95), rgba(5, 12, 30, 0.95)); border: 2px solid #00ffff; box-shadow: 0 0 35px rgba(0, 255, 255, 0.3); border-radius: 24px; padding: 35px 30px; max-width: 480px; width: 100%; text-align: center; }
        .glow-title { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: #00ffff; text-shadow: 0 0 15px #00ffff; margin-bottom: 8px; }
        .subtitle { color: #a0c0d0; font-size: 0.95rem; margin-bottom: 25px; }
        .diff-section h3 { font-size: 1rem; margin-bottom: 12px; color: #fff; }
        .diff-buttons { display: flex; gap: 10px; margin-bottom: 25px; }
        .diff-btn { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 255, 255, 0.2); border-radius: 12px; padding: 12px 8px; color: #8ae3ff; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: 'Kanit', sans-serif; }
        .diff-btn small { font-size: 0.7rem; opacity: 0.7; }
        .diff-btn.active, .diff-btn:hover { background: rgba(0, 255, 255, 0.2); border-color: #00ffff; color: #fff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .primary-btn, .share-btn { width: 100%; padding: 14px; font-size: 1.1rem; font-weight: 600; border-radius: 12px; border: none; cursor: pointer; transition: all 0.2s ease; font-family: 'Kanit', sans-serif; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .primary-btn { background: linear-gradient(90deg, #00c6ff, #0072ff); color: #fff; box-shadow: 0 0 20px rgba(0, 114, 255, 0.5); }
        .share-btn { background: linear-gradient(90deg, #11998e, #38ef7d); color: #fff; box-shadow: 0 0 20px rgba(56, 239, 125, 0.4); }
        .primary-btn:hover, .share-btn:hover { transform: translateY(-2px); filter: brightness(1.15); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .stat-item { background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; }
        .stat-label { font-size: 0.8rem; color: #a0c0d0; }
        .stat-val { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; color: #00ffff; font-weight: 700; }
        .action-buttons { display: flex; flex-direction: column; gap: 10px; }
        .hidden { display: none !important; }
        .pulse { animation: pulseAnim 1.8s infinite; }
        @keyframes pulseAnim { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    <div id="ui-container">
        <div class="hud-top">
            <div class="hud-box">
                <span class="hud-label"><i class="fa-solid fa-trophy"></i> คะแนน</span>
                <span class="hud-value" id="score-val">0</span>
            </div>
            <div class="hud-box timer-box">
                <span class="hud-label"><i class="fa-solid fa-clock"></i> เวลา</span>
                <span class="hud-value" id="timer-val">60s</span>
            </div>
            <div class="hud-box">
                <span class="hud-label"><i class="fa-solid fa-bolt"></i> คอมโบ</span>
                <span class="hud-value" id="combo-val">x1 (+10)</span>
            </div>
        </div>
        <div id="question-banner" class="hidden">
            <div class="q-title">แก้โจทย์คณิตศาสตร์!</div>
            <div id="math-expression">20 × 30 = ?</div>
        </div>
        <div id="toast" class="toast hidden"></div>
    </div>

    <div id="start-modal" class="modal">
        <div class="modal-card">
            <h1 class="glow-title"><i class="fa-solid fa-crosshairs"></i> AR MATH SHOOTER</h1>
            <p class="subtitle">เล็งปืนแล้วยิงคำตอบที่ถูกต้อง! สะสมให้ครบ 500 คะแนนเพื่อชนะ</p>
            <div class="diff-section">
                <h3><i class="fa-solid fa-sliders"></i> เลือกระดับความยาก</h3>
                <div class="diff-buttons">
                    <button class="diff-btn active" data-diff="easy">
                        <i class="fa-solid fa-seedling"></i> ง่าย
                        <small>บวก/ลบ เลขง่ายๆ</small>
                    </button>
                    <button class="diff-btn" data-diff="medium">
                        <i class="fa-solid fa-fire"></i> ปานกลาง
                        <small>คูณ/หาร ตัวเลข 2 หลัก</small>
                    </button>
                    <button class="diff-btn" data-diff="hard">
                        <i class="fa-solid fa-skull"></i> ยาก
                        <small>โจทย์ผสม 2 ขั้นตอน</small>
                    </button>
                </div>
            </div>
            <button id="start-btn" class="primary-btn pulse"><i class="fa-solid fa-play"></i> เริ่มเล่นเกม</button>
        </div>
    </div>

    <div id="gameover-modal" class="modal hidden">
        <div class="modal-card">
            <h1 id="end-title" class="glow-title">ภารกิจสำเร็จ!</h1>
            <p id="end-subtitle" class="subtitle">คุณเก่งมาก ทำคะแนนได้ทะลุเป้า!</p>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">คะแนนรวม</span>
                    <span class="stat-val" id="final-score">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">คอมโบสูงสุด</span>
                    <span class="stat-val" id="final-combo">x1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">ความแม่นยำ</span>
                    <span class="stat-val" id="final-accuracy">0%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">เวลาที่เหลือ</span>
                    <span class="stat-val" id="final-time">0s</span>
                </div>
            </div>
            <div class="action-buttons">
                <button id="restart-btn" class="primary-btn"><i class="fa-solid fa-rotate-right"></i> เล่นอีกครั้ง</button>
                <button id="share-btn" class="share-btn"><i class="fa-solid fa-share-nodes"></i> แชร์ผลคะแนน</button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, gunGroup, targetsGroup = [], raycaster, mouse;
        let score = 0, streak = 0, maxStreak = 0, timer = 60, timerInterval = null;
        let currentDifficulty = 'easy', currentQuestion = null, totalShots = 0, hitShots = 0, isPlaying = false;

        class SoundController {
            constructor() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playLaser() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.15);
            }
            playHit() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            }
            playMiss() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.setValueAtTime(100, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.25);
            }
        }
        const audio = new SoundController();

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x050a18, 0.05);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8); scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0x00ffff, 1.5); dirLight.position.set(5, 10, 7); scene.add(dirLight);

            const grid = new THREE.GridHelper(100, 40, 0x00ffff, 0x003366); grid.position.y = -5; scene.add(grid);
            buildGun();
            raycaster = new THREE.Raycaster(); mouse = new THREE.Vector2(0, 0);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('click', shoot);
        }

        function buildGun() {
            gunGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 1.5), new THREE.MeshStandardMaterial({ color: 0x112233, metalness: 0.8, roughness: 0.2 }));
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2, 16), new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.5 }));
            barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.1, -0.8);
            gunGroup.add(body); gunGroup.add(barrel);
            gunGroup.position.set(0, -0.8, -1.5); scene.add(gunGroup);
        }

        function generateMathQuestion(diff) {
            let a, b, op, ans;
            if (diff === 'easy') {
                op = Math.random() > 0.5 ? '+' : '-';
                if (op === '+') { a = Math.floor(Math.random() * 40) + 10; b = Math.floor(Math.random() * 40) + 10; ans = a + b; }
                else { a = Math.floor(Math.random() * 50) + 20; b = Math.floor(Math.random() * a); ans = a - b; }
            } else if (diff === 'medium') {
                op = Math.random() > 0.5 ? '×' : '÷';
                if (op === '×') { a = Math.floor(Math.random() * 20) + 5; b = Math.floor(Math.random() * 20) + 5; ans = a * b; }
                else { b = Math.floor(Math.random() * 12) + 2; ans = Math.floor(Math.random() * 15) + 2; a = b * ans; }
            } else {
                a = Math.floor(Math.random() * 20) + 10; b = Math.floor(Math.random() * 10) + 2; let c = Math.floor(Math.random() * 30) + 5;
                ans = (a * b) + c;
                return { text: `${a} × ${b} + ${c} = ?`, answer: ans, choices: generateChoices(ans) };
            }
            return { text: `${a} ${op} ${b} = ?`, answer: ans, choices: generateChoices(ans) };
        }

        function generateChoices(correctAns) {
            const choices = new Set([correctAns]);
            while (choices.size < 4) {
                let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 10 : -1);
                if (Math.random() > 0.5) offset = Math.floor(Math.random() * 8) + 1;
                let wrong = correctAns + offset; if (wrong >= 0) choices.add(wrong);
            }
            return Array.from(choices).sort(() => Math.random() - 0.5);
        }

        function spawnTargets() {
            targetsGroup.forEach(t => scene.remove(t)); targetsGroup = [];
            currentQuestion = generateMathQuestion(currentDifficulty);
            document.getElementById('math-expression').innerText = currentQuestion.text;

            const positions = [{ x: -2.5, y: 1.2, z: -5 }, { x: -0.8, y: -0.2, z: -5 }, { x: 0.8, y: 1.2, z: -5 }, { x: 2.5, y: -0.2, z: -5 }];
            currentQuestion.choices.forEach((val, idx) => {
                const group = new THREE.Group(); group.position.set(positions[idx].x, positions[idx].y, positions[idx].z);
                const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.55), new THREE.MeshStandardMaterial({ color: 0x00ffff, wireframe: true, emissive: 0x00aaaa }));
                group.add(mesh);

                const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 128;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = '#00ffff'; ctx.font = 'Bold 70px Orbitron';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(val, 128, 64);

                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
                sprite.scale.set(1.2, 0.6, 1); sprite.position.z = 0.6; group.add(sprite);
                group.userData = { value: val, isCorrect: val === currentQuestion.answer, mesh: mesh };
                scene.add(group); targetsGroup.push(group);
            });
        }

        function shoot(e) {
            if (!isPlaying || e.target.closest('.modal')) return;
            totalShots++; audio.playLaser();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(targetsGroup.map(t => t.userData.mesh));

            if (intersects.length > 0) {
                const targetObj = intersects[0].object.parent;
                if (targetObj.userData.isCorrect) {
                    hitShots++; streak++; if (streak > maxStreak) maxStreak = streak;
                    const gainedPoints = 10 * streak; score += gainedPoints;
                    audio.playHit(); showToast(`+${gainedPoints} แต้ม! (คอมโบ x${streak})`);
                    updateHUD();
                    if (score >= 500) endGame(true); else spawnTargets();
                } else {
                    streak = 0; audio.playMiss(); showToast(`ผิด! คอมโบถูกรีเซ็ต`); updateHUD();
                }
            }
        }

        function updateHUD() {
            document.getElementById('score-val').innerText = score;
            document.getElementById('combo-val').innerText = `x${streak || 1} (+${10 * Math.max(1, streak)})`;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast'); toast.innerText = msg;
            toast.classList.remove('hidden'); setTimeout(() => toast.classList.add('hidden'), 1200);
        }

        function onMouseMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            if (gunGroup) { gunGroup.rotation.y = -mouse.x * 0.3; gunGroup.rotation.x = mouse.y * 0.3; }
        }

        function onTouchMove(e) {
            if (e.touches.length > 0) {
                mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
                if (gunGroup) { gunGroup.rotation.y = -mouse.x * 0.3; gunGroup.rotation.x = mouse.y * 0.3; }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            targetsGroup.forEach((t, i) => { t.rotation.y += 0.01; t.position.y += Math.sin(Date.now() * 0.003 + i) * 0.003; });
            renderer.render(scene, camera);
        }

        function startGame() {
            score = 0; streak = 0; maxStreak = 0; totalShots = 0; hitShots = 0; timer = 60; isPlaying = true;
            updateHUD();
            document.getElementById('timer-val').innerText = `${timer}s`;
            document.getElementById('start-modal').classList.add('hidden');
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('question-banner').classList.remove('hidden');
            spawnTargets();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer--;
                document.getElementById('timer-val').innerText = `${timer}s`;
                if (timer <= 0) endGame(false);
            }, 1000);
        }

        function endGame(isVictory) {
            isPlaying = false; clearInterval(timerInterval);
            document.getElementById('question-banner').classList.add('hidden');
            document.getElementById('gameover-modal').classList.remove('hidden');
            const accuracy = totalShots > 0 ? Math.round((hitShots / totalShots) * 100) : 0;
            document.getElementById('end-title').innerText = isVictory ? "ภารกิจสำเร็จ!" : "หมดเวลา!";
            document.getElementById('end-subtitle').innerText = isVictory ? "คุณทำคะแนนทะลุเป้าหมาย 500 แต้ม!" : "ลองใหม่อีกครั้งเพื่อทำคะแนนให้สูงขึ้น";
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-combo').innerText = `x${maxStreak}`;
            document.getElementById('final-accuracy').innerText = `${accuracy}%`;
            document.getElementById('final-time').innerText = `${timer}s`;
        }

        function shareScore() {
            const text = `🎯 AR Math Shooter 3D!\nคะแนน: ${score} แต้ม\nคอมโบสูงสุด: x${maxStreak}\nระดับ: ${currentDifficulty.toUpperCase()}\nมาลองเล่นท้าทายกันเลย!`;
            if (navigator.share) { navigator.share({ title: 'AR Math Shooter Score', text: text }); }
            else { navigator.clipboard.writeText(text); showToast('คัดลอกผลคะแนนเรียบร้อย!'); }
        }

        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                currentDifficulty = e.currentTarget.dataset.diff;
            });
        });

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
        document.getElementById('share-btn').addEventListener('click', shareScore);

        init3D(); animate();
    </script>
</body>
</html>
